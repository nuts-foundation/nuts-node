url: https://node-A
verbosity: debug
strictmode: true
internalratelimiter: false
datadir: /opt/nuts/data
http:
  internal:
    address: :8081
auth:
  contractvalidators:
    - dummy
  irma:
    autoupdateschemas: false
crypto:
  storage: fs
goldenhammer:
  enabled: false
vcr:
  openid4vci:
    enabled: false
tls:
  truststorefile: /opt/nuts/truststore.pem
  certfile: /opt/nuts/certificate-and-key.pem
  certkeyfile: /opt/nuts/certificate-and-key.pem
network:
  grpcaddr:	:5555
  # Keep persisted connection backoffs short: with the KV stores on SQL there is no connections.db file to delete
  # between restarts, and the test restarts the nodes a few times.
  maxbackoff: 2s
  v2:
    gossipinterval: 500
storage:
  kv:
    backend: sql
  # storage.sql.connection is set through NUTS_STORAGE_SQL_CONNECTION per database variant

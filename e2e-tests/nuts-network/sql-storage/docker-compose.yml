services:
  nodeA:
    user: "$USER:$USER"
    image: "${IMAGE_NODE_A:-nutsfoundation/nuts-node:master}"
    environment:
      NUTS_CONFIGFILE: /opt/nuts/nuts.yaml
      NUTS_NETWORK_NODEDID: "${NODE_A_DID}"
      NUTS_NETWORK_ENABLEDISCOVERY: "${ENABLE_DISCOVERY}"
      NUTS_STORAGE_KV_BACKEND: "${KV_BACKEND}"
      NUTS_STORAGE_SQL_CONNECTION: "${NODE_A_SQL}"
    ports:
      - "18081:8081"
    volumes:
      - "./node-A/data:/opt/nuts/data"
      - "./node-A/nuts.yaml:/opt/nuts/nuts.yaml:ro"
      - "../../tls-certs/nodeA-certificate.pem:/opt/nuts/certificate-and-key.pem:ro"
      - "../../tls-certs/truststore.pem:/opt/nuts/truststore.pem:ro"
    healthcheck:
      interval: 1s # Make test run quicker by checking health status more often
  nodeB:
    user: "$USER:$USER"
    image: "${IMAGE_NODE_B:-nutsfoundation/nuts-node:master}"
    environment:
      NUTS_CONFIGFILE: /opt/nuts/nuts.yaml
      NUTS_NETWORK_NODEDID: "${NODE_B_DID}"
      NUTS_NETWORK_BOOTSTRAPNODES: ${BOOTSTRAP_NODES}
      NUTS_NETWORK_ENABLEDISCOVERY: "${ENABLE_DISCOVERY}"
      NUTS_STORAGE_KV_BACKEND: "${KV_BACKEND}"
      NUTS_STORAGE_SQL_CONNECTION: "${NODE_B_SQL}"
    ports:
      - "28081:8081"
    volumes:
      - "./node-B/data:/opt/nuts/data"
      - "./node-B/nuts.yaml:/opt/nuts/nuts.yaml:ro"
      - "../../tls-certs/nodeB-certificate.pem:/opt/nuts/certificate-and-key.pem:ro"
      - "../../tls-certs/truststore.pem:/opt/nuts/truststore.pem:ro"
    healthcheck:
      interval: 1s # Make test run quicker by checking health status more often
  # One database server per variant, each hosting a separate database per node (nodea, nodeb):
  # two nodes sharing one set of KV tables would be one node with two instances, not two nodes.
  postgres:
    profiles: [ "postgres" ]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nuts
      POSTGRES_PASSWORD: nuts
      POSTGRES_DB: nodea
    ports:
      - "15432:5432"
    volumes:
      - "./db-init/postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U nuts -d nodea" ]
      interval: 2s
      timeout: 5s
      retries: 30
  mysql:
    profiles: [ "mysql" ]
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: nuts
      MYSQL_DATABASE: nodea
    ports:
      - "13306:3306"
    volumes:
      - "./db-init/mysql.sql:/docker-entrypoint-initdb.d/init.sql:ro"
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -uroot -pnuts --silent" ]
      interval: 2s
      timeout: 5s
      retries: 45
  sqlserver:
    profiles: [ "sqlserver" ]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Nuts!Passw0rd"
    ports:
      - "11433:1433"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Nuts!Passw0rd' -Q 'SELECT 1' > /dev/null" ]
      interval: 3s
      timeout: 10s
      retries: 60

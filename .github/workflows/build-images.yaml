---
name: 'Build Docker images'

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

# cancel build action if superseded by new commit on same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set version params
        id: version
        shell: bash
        run: |
          echo "git_commit=$(echo ${GITHUB_SHA})" >> $GITHUB_OUTPUT
          echo "git_branch=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_OUTPUT
          echo "git_version=$(git name-rev --tags --name-only $(git rev-parse HEAD))" >> $GITHUB_OUTPUT

      - uses: actions-ecosystem/action-get-latest-tag@v1
        id: get-latest-tag
        with:
          semver_only: true

      - name: Print version params
        run: |
          echo "Commit: ${{ steps.version.outputs.git_commit }}"
          echo "Branch: ${{ steps.version.outputs.git_branch }}"
          echo "Version: ${{ steps.version.outputs.git_version }}"
          echo "Latest tag: ${{ steps.get-latest-tag.outputs.tag }}"
          echo "This tag: ${{ github.ref }}"

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: nutsfoundation/nuts-node
          tags: |
            # generate 'master' tag for the master branch
            type=ref,event=branch,enable={{is_default_branch}},prefix=
            # generate 5.2.1 tag
            type=semver,pattern={{version}}
          flavor: |
            latest=${{ steps.version.outputs.git_version == steps.get-latest-tag.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          # On PRs we only verify the build doesn't break; arm64 under QEMU
          # is ~5-8x slower and adds no signal there. Multi-arch on push/tag.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          build-args: |
            GIT_VERSION=${{ steps.version.outputs.git_version }}
            GIT_COMMIT=${{ steps.version.outputs.git_commit }}
            GIT_BRANCH=${{ steps.version.outputs.git_branch }}
          # SLSA provenance and SBOM, embedded as attestation manifests in the
          # image index; made tamper-evident by the signature in the sign job.
          provenance: mode=max
          sbom: true

      - name: Build and push development image
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master'}}
        uses: docker/build-push-action@v7
        with:
          context: development/dev-image
          push: true
          platforms: linux/amd64,linux/arm64
          tags: nutsfoundation/nuts-node:dev

  sign:
    # Separate job so id-token is only granted where no third-party build
    # actions run. Skipped on pull_request: GitHub issues no OIDC tokens to
    # workflows triggered from forks.
    runs-on: ubuntu-latest
    needs: docker
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      id-token: write
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v4

      - name: Sign image with the workflow's OIDC identity (Sigstore keyless)
        run: cosign sign --yes nutsfoundation/nuts-node@${{ needs.docker.outputs.image_digest }}

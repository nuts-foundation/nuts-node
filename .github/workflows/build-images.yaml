---
name: 'Build Docker images'

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

# cancel build action if superseded by new commit on same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# deny-all default; each job below grants only the scopes it needs
permissions: {}

jobs:
  # Docs-only changes (docs/, markdown, rst) can't affect the built image, so building/pushing one
  # is redundant. Detected once here so the job below can skip entirely on them.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for non-doc changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!**/*.rst'

  docker:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # all tags are needed to decide whether this build is the highest release
          fetch-tags: true
          # go build stamps the module version from git. A tag build only needs
          # the tagged commit. An untagged branch push (the :master image) needs
          # the history back to the nearest tag, otherwise the stamp becomes
          # v6.0.0-<time>-<rev>, which sorts below every release and trips image
          # scanners. Pull request builds are not pushed, so they stay shallow.
          # fetch-tags above does not cover this: at depth 1 the tag objects
          # exist but the tagged commit is not an ancestor of HEAD, so go build
          # still stamps v6.0.0-<time>-<rev>.
          fetch-depth: ${{ github.event_name == 'push' && github.ref_type == 'branch' && 0 || 1 }}

      - name: Set version params
        id: version
        shell: bash
        run: |
          echo "git_commit=$(echo ${GITHUB_SHA})" >> $GITHUB_OUTPUT
          echo "git_branch=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_OUTPUT
          echo "git_version=$(git name-rev --tags --name-only $(git rev-parse HEAD))" >> $GITHUB_OUTPUT

      - name: Determine highest release tag
        # Sort by version, not by creation date: a v5.4.x patch tagged after a
        # v6.2.x patch must not become 'latest'.
        id: get-latest-tag
        shell: bash
        run: |
          echo "tag=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)" >> $GITHUB_OUTPUT

      - name: Print version params
        env:
          GIT_COMMIT: ${{ steps.version.outputs.git_commit }}
          GIT_BRANCH: ${{ steps.version.outputs.git_branch }}
          GIT_VERSION: ${{ steps.version.outputs.git_version }}
          LATEST_TAG: ${{ steps.get-latest-tag.outputs.tag }}
          THIS_TAG: ${{ github.ref }}
        run: |
          echo "Commit: ${GIT_COMMIT}"
          echo "Branch: ${GIT_BRANCH}"
          echo "Version: ${GIT_VERSION}"
          echo "Latest tag: ${LATEST_TAG}"
          echo "This tag: ${THIS_TAG}"

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: nutsfoundation/nuts-node
          tags: |
            # generate 'master' tag for the master branch
            type=ref,event=branch,enable={{is_default_branch}},prefix=
            # generate 5.2.1 tag
            type=semver,pattern={{version}}
          flavor: |
            latest=${{ steps.version.outputs.git_version == steps.get-latest-tag.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to Docker Hub
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          # On PRs we only verify the build doesn't break; arm64 under QEMU
          # is ~5-8x slower and adds no signal there. Multi-arch on push/tag.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          build-args: |
            GIT_VERSION=${{ steps.version.outputs.git_version }}
            GIT_COMMIT=${{ steps.version.outputs.git_commit }}
            GIT_BRANCH=${{ steps.version.outputs.git_branch }}
          # SLSA provenance and SBOM, embedded as attestation manifests in the
          # image index; made tamper-evident by the signature in the sign job.
          provenance: mode=max
          sbom: true

      - name: Build and push development image
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master'}}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: development/dev-image
          push: true
          platforms: linux/amd64,linux/arm64
          tags: nutsfoundation/nuts-node:dev

  sign:
    # Separate job so id-token is only granted where no third-party build
    # actions run. Skipped on pull_request: GitHub issues no OIDC tokens to
    # workflows triggered from forks.
    runs-on: ubuntu-latest
    needs: docker
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      id-token: write
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with the workflow's OIDC identity (Sigstore keyless)
        env:
          IMAGE_DIGEST: ${{ needs.docker.outputs.image_digest }}
        run: |
          if [ -z "${IMAGE_DIGEST}" ]; then
            echo "::error::build job produced no image digest; nothing to sign"
            exit 1
          fi
          cosign sign --yes "nutsfoundation/nuts-node@${IMAGE_DIGEST}"

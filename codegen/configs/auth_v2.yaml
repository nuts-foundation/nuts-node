package: iam
generate:
  echo-server: true
  models: true
  strict-server: true
output-options:
  skip-prune: false
  exclude-schemas:
    - DIDDocument
    - OAuthAuthorizationServerMetadata
    - OAuthClientMetadata
    - PresentationDefinition
    - PresentationSubmission
    - RedirectResponse
    - TokenResponse
    - VerifiablePresentation
    - VerifiableCredential
    - WalletOwnerType
    - RequiredPresentationDefinitions
    - ErrorResponse
    - TokenIntrospectionResponse
import-mapping:
  ../common/ssi_types.yaml: github.com/nuts-foundation/nuts-node/v6/api
